<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Stations · Radio Rocky Beach</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="all-stations">All Stations</h1>
  <p class="status" id="status">Lädt…</p>
  <section class="all-stations-grid card" id="grid"></section>
  <p class="show-all">
    <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
    <a href="index.html">Zurück zur Startseite</a>
  </p>

  <script type="module">
    import { getStations, getStationId, getName, imageUrl } from './api.js'
    import { setFavicon } from './icons.js'

    setFavicon()

    const status = document.getElementById('status')
    const grid = document.getElementById('grid')

    try {
      const stations = await getStations()

      if (stations.length === 0) {
        status.textContent = 'Gerade sind keine Sender online.'
      } else {
        status.hidden = true
      }

      const sorted = [...stations].sort((a, b) => getName(a).localeCompare(getName(b)))
      for (const s of sorted) {
        const id = getStationId(s.listenurl)
        const link = document.createElement('a')
        link.href = `station.html?id=${encodeURIComponent(id)}`

        const img = document.createElement('img')
        img.src = imageUrl(id)
        img.alt = getName(s)
        img.title = getName(s)
        img.loading = 'lazy'

        link.append(img)
        grid.append(link)
      }
    } catch (error) {
      console.error(error)
      status.textContent = 'Sender konnten nicht geladen werden.'
    }
  </script>
</body>
</html>
